name: Publish Docker Images

on:
  push:
    branches: [main, rc]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a supported semantic version: $version" >&2
            exit 1
          fi

          image_tag=rc
          is_stable=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Git tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
              exit 1
            fi
            image_tag="$version"
            if [[ "$version" != *-* ]]; then
              is_stable=true
            fi
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            image_tag=latest
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "is_stable=$is_stable" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify backend
        run: |
          dotnet restore backend/KhaiKang.Backend.slnx --configfile backend/NuGet.config
          dotnet build backend/KhaiKang.Backend.slnx --configuration Release --no-restore
          dotnet test backend/KhaiKang.Backend.slnx --configuration Release --no-build

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm test
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/khaikang-api
          tags: |
            type=raw,value=${{ steps.release-version.outputs.image_tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.release-version.outputs.is_stable == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.release-version.outputs.version }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/khaikang-web
          tags: |
            type=raw,value=${{ steps.release-version.outputs.image_tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.release-version.outputs.is_stable == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.release-version.outputs.version }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

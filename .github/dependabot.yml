version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      compose-docker:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      docker-build:
        patterns: ["*"]

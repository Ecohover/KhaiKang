services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      KHAIKANG_DOMAIN: ${KHAIKANG_DOMAIN:?Set KHAIKANG_DOMAIN in .env}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

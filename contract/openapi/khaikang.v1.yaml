openapi: 3.1.1
info:
  title: KhaiKang API
  version: 1.0.0
  description: Public HTTP contract for KhaiKang v1.
paths:
  /health/live:
    get:
      tags: [System]
      operationId: LiveHealth
      responses:
        '200':
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/system/info:
    get:
      tags: [System]
      operationId: GetSystemInfo
      responses:
        '200':
          description: Runtime information for the API process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoResponse'
  /api/v1/setup/status:
    get:
      tags: [Setup]
      operationId: GetSetupStatus
      responses:
        '200':
          description: Whether the first administrator must be initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
  /api/v1/setup/initialize:
    post:
      tags: [Setup]
      operationId: InitializeAdmin
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: One-time credentials for the initial administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeAdminResponse'
        '409':
          description: The system has already been initialized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://khaikang.dev/problems/setup/already-initialized
                status: 409
                code: already_initialized
                detail: KhaiKang has already been initialized.
  /api/v1/auth/csrf-token:
    get:
      tags: [Authentication]
      operationId: GetCsrfToken
      responses:
        '200':
          description: A CSRF request token and its paired cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: Login
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The authenticated user. Session cookies are set by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '400':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are invalid or the account cannot sign in.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://khaikang.dev/problems/auth/invalid-credentials
                status: 401
                code: invalid_credentials
                detail: The username or password is invalid.
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: RefreshSession
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The refreshed authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          description: The refresh session is missing, expired, or revoked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://khaikang.dev/problems/auth/session-expired
                status: 401
                code: session_expired
                detail: The login session has expired.
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: GetCurrentUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          description: No valid authenticated session exists.
  /api/v1/auth/password:
    post:
      tags: [Authentication]
      operationId: ChangePassword
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '400':
          description: The current password is invalid or validation failed.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: No valid authenticated session exists.
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: Logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The current session was revoked and cookies were cleared.
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: ListAccounts
      security:
        - sessionCookie: []
      responses:
        '200':
          description: All local user accounts visible to an account administrator.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current user lacks account.read.
    post:
      tags: [Accounts]
      operationId: CreateAccount
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The local user account was created with a one-time initial password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountResponse'
        '400':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current user lacks account.create.
        '409':
          description: The username is already in use.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/accounts/{accountId}:
    put:
      tags: [Accounts]
      operationId: UpdateAccount
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: The account username was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current user lacks account.update.
        '404':
          description: The account does not exist.
        '409':
          description: The username is already in use, the current account cannot edit itself, or the account version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/accounts/{accountId}/status:
    put:
      tags: [Accounts]
      operationId: UpdateAccountStatus
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountStatusRequest'
      responses:
        '200':
          description: The account status was changed and non-active account sessions were revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current user lacks account.suspend.
        '404':
          description: The account does not exist.
        '409':
          description: The administrator attempted to change their own status, or the account version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: ListProjects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Projects where the current user is an active member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: No valid authenticated session exists.
    post:
      tags: [Projects]
      operationId: CreateProject
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The project was created and the creator was assigned Owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current user does not have the project.create system permission.
        '409':
          description: The project code is already in use.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      operationId: GetProject
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project details visible to the current project member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: No valid authenticated session exists.
        '404':
          description: The project does not exist or is not visible to the current user.
    put:
      tags: [Projects]
      operationId: UpdateProject
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: The project basic information was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current project member lacks project.update, or the user lacks project.deactivate for a status change.
        '404':
          description: The project does not exist or is not visible to the current user.
        '409':
          description: The project was updated by another user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/projects/{projectId}/roles:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      operationId: ListProjectRoles
      security:
        - sessionCookie: []
      responses:
        '200':
          description: System-provided project roles available for assignment.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRoleResponse'
        '401':
          description: No valid authenticated session exists.
        '404':
          description: The project does not exist or is not visible to the current member.
  /api/v1/projects/{projectId}/members:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      operationId: ListProjectMembers
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active members of the project.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
        '401':
          description: No valid authenticated session exists.
        '404':
          description: The project does not exist or is not visible to the current member.
    post:
      tags: [Projects]
      operationId: AddProjectMember
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: The active account was added to the project with the selected roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '400':
          description: Username or role selection is invalid.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks project.member.add or project.role.assign.
        '404':
          description: The project or active account was not found.
        '409':
          description: The account is already an active member.
  /api/v1/projects/{projectId}/members/{memberId}/roles:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Projects]
      operationId: UpdateProjectMemberRoles
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectMemberRolesRequest'
      responses:
        '200':
          description: The member roles were replaced by the selected default roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '400':
          description: Role selection or version is invalid.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks project.role.assign.
        '404':
          description: The project or active member was not found.
        '409':
          description: The change would remove the final Owner, or the member version is stale.
  /api/v1/projects/{projectId}/members/{memberId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Projects]
      operationId: RemoveProjectMember
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '204':
          description: The member relationship was marked as removed.
        '400':
          description: The member version is invalid.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks project.member.remove.
        '404':
          description: The project or active member was not found.
        '409':
          description: The removal would remove the final Owner, or the member version is stale.
  /api/v1/projects/{projectId}/issues:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Issues]
      operationId: ListIssues
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of tasks visible to the current project member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuePageResponse'
        '400':
          description: The paging parameters are outside the supported range.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks issue.read.
        '404':
          description: The project does not exist or is not visible to the current member.
    post:
      tags: [Issues]
      operationId: CreateIssue
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: The task was created in the initial created status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          description: Request validation, type, priority, or assignee selection failed.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks issue.create.
        '404':
          description: The project does not exist or is not visible to the current member.
        '409':
          description: The project is inactive, or a concurrent task creation used the same project task number.
  /api/v1/projects/{projectId}/issues/metadata:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Issues]
      operationId: GetIssueMetadata
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active task types, statuses, and priorities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMetadataResponse'
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks issue.read.
        '404':
          description: The project does not exist or is not visible to the current member.
  /api/v1/projects/{projectId}/issues/{issueId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: issueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Issues]
      operationId: GetIssue
      security:
        - sessionCookie: []
      responses:
        '200':
          description: A single task visible to the current project member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '401':
          description: No valid authenticated session exists.
        '404':
          description: The project or task does not exist or is not visible.
    put:
      tags: [Issues]
      operationId: UpdateIssue
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: The task details were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          description: Request validation or option selection failed.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks issue.update.
        '404':
          description: The project or task does not exist or is not visible.
        '409':
          description: The project is inactive, or the task was updated by another user.
  /api/v1/projects/{projectId}/issues/{issueId}/assignee:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: issueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Issues]
      operationId: UpdateIssueAssignee
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueAssigneeRequest'
      responses:
        '200':
          description: The task assignee was changed or cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          description: The assignee is not an active project member, or the version is invalid.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks issue.assignee.change.
        '404':
          description: The project or task does not exist or is not visible to the current member.
        '409':
          description: The project is inactive, or the task was updated by another user.
  /api/v1/projects/{projectId}/issues/{issueId}/status:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: issueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Issues]
      operationId: UpdateIssueStatus
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueStatusRequest'
      responses:
        '200':
          description: The task status was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          description: The target status or version is invalid.
        '401':
          description: No valid authenticated session exists.
        '403':
          description: The current member lacks issue.status.change.
        '404':
          description: The project or task does not exist or is not visible to the current member.
        '409':
          description: The project is inactive, or the task was updated by another user.
  /api/v1/test-workspaces:
    get:
      tags: [Test Management]
      operationId: ListTestWorkspaces
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Test workspaces visible to the current member.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestWorkspaceResponse' }
        '401': { description: No valid authenticated session exists. }
    post:
      tags: [Test Management]
      operationId: CreateTestWorkspace
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTestWorkspaceRequest' }
      responses:
        '201':
          description: Workspace created with the current account as Owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestWorkspaceResponse' }
        '400': { description: Request validation failed. }
        '409': { description: Workspace name conflict. }
  /api/v1/test-workspaces/{workspaceId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Test Management]
      operationId: GetTestWorkspace
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Workspace details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestWorkspaceResponse' }
        '404': { description: Workspace is not visible to the current account. }
    put:
      tags: [Test Management]
      operationId: UpdateTestWorkspace
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTestWorkspaceRequest' }
      responses:
        '200':
          description: Workspace updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestWorkspaceResponse' }
        '403': { description: Only an Owner can update workspace settings. }
        '409': { description: Name or version conflict. }
  /api/v1/test-workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Test Management]
      operationId: ListTestWorkspaceMembers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active workspace members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestWorkspaceMemberResponse' }
    post:
      tags: [Test Management]
      operationId: AddTestWorkspaceMember
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:

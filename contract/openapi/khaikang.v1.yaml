        '404': { description: Plan or workspace not found. }
    put:
      tags: [Test Management]
      operationId: UpdateTestPlan
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:

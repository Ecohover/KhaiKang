    post:
      tags: [Test Management]
      operationId: CreateTestRun
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTestRunRequest' }
      responses:
        '201':
          description: Run and immutable case and step snapshots created atomically.
          content:

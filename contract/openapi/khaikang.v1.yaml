              schema: { $ref: '#/components/schemas/TestWorkspaceMemberResponse' }
        '403': { description: Current role cannot manage members. }
        '409': { description: Account is already an active member. }
  /api/v1/test-workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - name: workspaceId
        in: path
        required: true

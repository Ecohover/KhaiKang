        '400': { description: Scope contains duplicate, inactive, or foreign cases. }
        '403': { description: Current role cannot manage plans. }
  /api/v1/test-workspaces/{workspaceId}/plans/{planId}:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Test Management]
      operationId: GetTestPlan
      security: [{ sessionCookie: [] }]
      responses:
        '200':

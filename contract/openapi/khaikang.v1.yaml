            schema: { $ref: '#/components/schemas/UpdateTestCaseRequest' }
      responses:
        '200':
          description: Test case updated with new properties and steps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCaseResponse' }
        '400': { description: Request validation failed. }
        '403': { description: Current role cannot manage test cases. }
        '404': { description: Test case, workspace, or suite does not exist. }
        '409': { description: Version conflict or invalid suite target. }

  /api/v1/test-workspaces/{workspaceId}/runs/{runId}:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Test Management]
      operationId: GetTestRun
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Run snapshot, results, and progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRunResponse' }
        '404': { description: Run or workspace not found. }
  /api/v1/test-workspaces/{workspaceId}/runs/{runId}/items/{itemId}:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Test Management]
      operationId: RecordTestRunItem
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordTestResultRequest' }
      responses:
        '200':
          description: Case result recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRunResponse' }
        '409': { description: Run is terminal or version conflicts. }
  /api/v1/test-workspaces/{workspaceId}/runs/{runId}/items/{itemId}/steps/{stepId}:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Test Management]
      operationId: RecordTestRunStep
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordTestResultRequest' }
      responses:
        '200':
          description: Step result recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRunResponse' }
        '409': { description: Run is terminal or version conflicts. }
  /api/v1/test-workspaces/{workspaceId}/runs/{runId}/status:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Test Management]
      operationId: UpdateTestRunStatus
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTestRunStatusRequest' }
      responses:
        '200':
          description: Start or restart a cancelled run, or complete or cancel an in-progress run. Completed runs are immutable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRunResponse' }
        '409': { description: Run is terminal, incomplete, or version conflicts. }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: KhaiKang.Session
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of records returned per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token returned by `getCsrfToken`; its paired cookie is also required.
      schema:
        type: string
  schemas:
    TestWorkspaceRole:
      type: string
      enum: [owner, manager, tester, viewer]
    CreateTestWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
    UpdateTestWorkspaceRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTestWorkspaceRequest'
        - type: object
          required: [status, version]
          properties:
            status: { type: string, enum: [active, inactive] }
            version: { type: integer, minimum: 1 }
    TestWorkspaceResponse:
      type: object
      additionalProperties: false
      required: [id, name, description, status, currentUserRole, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        currentUserRole: { $ref: '#/components/schemas/TestWorkspaceRole' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    AddTestWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username: { type: string }
        role: { $ref: '#/components/schemas/TestWorkspaceRole' }
    UpdateTestWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required: [role, version]
      properties:
        role: { $ref: '#/components/schemas/TestWorkspaceRole' }
        version: { type: integer, minimum: 1 }
    TestWorkspaceMemberResponse:
      type: object
      additionalProperties: false
      required: [id, accountId, username, role, status, joinedAt, version]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/TestWorkspaceRole' }
        status: { type: string, enum: [active, removed] }
        joinedAt: { type: string, format: date-time }
        version: { type: integer }
    CreateTestSuiteRequest:
      type: object
      additionalProperties: false
      required: [parentId, name, description, sortOrder]
      properties:
        parentId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        sortOrder: { type: integer, minimum: 0 }
    UpdateTestSuiteRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTestSuiteRequest'
        - type: object
          required: [status, version]
          properties:
            status: { type: string, enum: [active, inactive] }
            version: { type: integer, minimum: 1 }
    TestSuiteResponse:
      type: object
      additionalProperties: false
      required: [id, parentId, name, description, sortOrder, status, depth, version]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        sortOrder: { type: integer }
        status: { type: string, enum: [active, inactive] }
        depth: { type: integer, minimum: 1, maximum: 5 }
        version: { type: integer }
    CreateTestCaseStepRequest:
      type: object
      additionalProperties: false
      required: [action, expectedResult]
      properties:
        action: { type: string, minLength: 1, maxLength: 4000 }
        expectedResult: { type: string, minLength: 1, maxLength: 4000 }
    CreateTestCaseRequest:
      type: object
      additionalProperties: false
      required:
        - suiteId
        - title
        - description
        - preconditions
        - overallExpectedResult
        - sortOrder
        - steps
      properties:
        suiteId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        preconditions: { type: [string, 'null'], maxLength: 4000 }
        overallExpectedResult: { type: [string, 'null'], maxLength: 4000 }
        sortOrder: { type: integer, minimum: 0 }
        tagIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CreateTestCaseStepRequest' }
    UpdateTestCaseRequest:
      type: object
      additionalProperties: false
      required:
        - suiteId
        - title
        - description
        - preconditions
        - overallExpectedResult
        - sortOrder
        - status
        - version
        - steps
      properties:
        suiteId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        preconditions: { type: [string, 'null'], maxLength: 4000 }
        overallExpectedResult: { type: [string, 'null'], maxLength: 4000 }
        sortOrder: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, inactive] }
        version: { type: integer, minimum: 1 }
        tagIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CreateTestCaseStepRequest' }
    TestCaseStepResponse:
      type: object
      additionalProperties: false
      required: [id, stepNo, action, expectedResult]
      properties:
        id: { type: string, format: uuid }
        stepNo: { type: integer, minimum: 1 }
        action: { type: string }
        expectedResult: { type: string }
    TestCaseResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - suiteId
        - caseNo
        - tags
        - title
        - description
        - preconditions
        - overallExpectedResult
        - sortOrder
        - status
        - steps
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: string, format: uuid }
        suiteId: { type: string, format: uuid }
        caseNo: { type: integer, minimum: 1 }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TestTagResponse' }
        title: { type: string }
        description: { type: [string, 'null'] }
        preconditions: { type: [string, 'null'] }
        overallExpectedResult: { type: [string, 'null'] }
        sortOrder: { type: integer }
        status: { type: string, enum: [active, inactive] }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TestCaseStepResponse' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TestTagResponse:
      type: object
      additionalProperties: false
      required: [id, name, description, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        description: { type: [string, 'null'], maxLength: 4000 }
        status: { type: string, enum: [active, inactive] }
        version: { type: integer, minimum: 1 }
    CreateTestTagRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: [string, 'null'], maxLength: 4000 }
    UpdateTestTagRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTestTagRequest'
        - type: object
          required: [status, version]
          properties:
            status: { type: string, enum: [active, inactive] }
            version: { type: integer, minimum: 1 }
    CreateTestPlanRequest:
      type: object
      additionalProperties: false
      required: [description, caseIds]
      properties:
        name:
          type: [string, 'null']
          maxLength: 200
          description: Defaults to TestPlanyyyyMMdd in Asia/Taipei when omitted, null, or blank.
        description: { type: [string, 'null'], maxLength: 4000 }
        caseIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }
    UpdateTestPlanRequest:
      type: object
      additionalProperties: false
      required: [description, caseIds, status, version]
      properties:
        name:
          type: [string, 'null']
          maxLength: 200
          description: Defaults to TestPlanyyyyMMdd in Asia/Taipei when omitted, null, or blank.
        description: { type: [string, 'null'], maxLength: 4000 }
        caseIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }
        status: { type: string, enum: [draft, active, archived] }
        version: { type: integer, minimum: 1 }
    TestPlanItemResponse:
      type: object
      additionalProperties: false
      required: [id, caseId, sortOrder, caseTitle]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        sortOrder: { type: integer, minimum: 1 }
        caseTitle: { type: string }
    TestPlanResponse:
      type: object
      additionalProperties: false
      required: [id, workspaceId, planNo, code, name, description, status, items, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        planNo: { type: integer, minimum: 1 }
        code:
          type: string
          description: Workspace-scoped display code, for example QA-TP1.
        name: { type: string }
